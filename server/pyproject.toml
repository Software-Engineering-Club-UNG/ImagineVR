[project]
name = "imagine-server"
version = "0.1.0"
description = "ImagineVR server: turns speech into ImagineScript and streams it to the headset"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "faster-whisper>=1.1",
    "numpy>=1.26",
]

[tool.uv]
package = false
