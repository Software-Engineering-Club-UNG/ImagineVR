name: Provision ImagineVR API host
on:
  workflow_dispatch:
    inputs:
      allow_http_demo:
        description: 'Allow unencrypted HTTP if TLS issuance fails (trusted-network demo only)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: openrouter-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure privileged provisioning authentication
        env:
          KEY: ${{ secrets.VULTR_PROVISION_SSH_KEY }}
        run: |
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          install -m 600 infra/deploy/known_hosts ~/.ssh/known_hosts
      - name: Configure host and runtime secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IMAGINE_APP_TOKEN: ${{ secrets.IMAGINE_APP_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ALLOW_HTTP_DEMO: ${{ inputs.allow_http_demo && '1' || '0' }}
        run: |
          python - <<'PY'
          import os, re
          for name in ('OPENROUTER_API_KEY', 'IMAGINE_APP_TOKEN', 'ELEVENLABS_API_KEY'):
              value = os.environ[name]
              if not re.fullmatch(r'[A-Za-z0-9_.-]{20,}', value) or value == 'dev-token':
                  raise SystemExit(f'Add a valid repository secret: {name}')
          PY
          tar -czf "$RUNNER_TEMP/provision.tar.gz" infra/deploy
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/provision.tar.gz" ubuntu@64.177.52.162:/tmp/imagine-provision.tar.gz
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@64.177.52.162 \
            "sudo install -d -m 700 /opt/imagine-provision; sudo tar -xzf /tmp/imagine-provision.tar.gz -C /opt/imagine-provision; sudo env ALLOW_HTTP_DEMO='$ALLOW_HTTP_DEMO' bash /opt/imagine-provision/infra/deploy/bootstrap.sh /opt/imagine-provision/infra/deploy/keys/github-actions.pub"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@64.177.52.162 \
            'sudo bash /opt/imagine-provision/infra/deploy/install-environment.sh' <<EOF
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          IMAGINE_APP_TOKEN=$IMAGINE_APP_TOKEN
          ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY
          IMAGINE_STT=elevenlabs
          EOF
      - name: Remove provisioning key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
