name: Test and deploy openrouter-api

on:
  push:
    branches: [main]
    paths:
      - 'openrouter-api/**'
      - 'infra/deploy/**'
      - 'shared/**'
      - '.github/workflows/deploy-openrouter-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'openrouter-api/**'
      - 'infra/deploy/**'
      - 'shared/**'
      - '.github/workflows/deploy-openrouter-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - name: Install and test backend
        working-directory: openrouter-api
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Check deployment scripts
        run: |
          bash -n infra/deploy/bootstrap.sh infra/deploy/prepare-whisper.sh infra/deploy/install-environment.sh infra/deploy/deploy.sh infra/deploy/tests/test-deploy.sh
          bash infra/deploy/tests/test-deploy.sh

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: openrouter-api-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: '64.177.52.162'
      DEPLOY_USER: deploy
      API_URL: ${{ vars.IMAGINE_API_URL || 'https://64.177.52.162.sslip.io' }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure deployment authentication
        env:
          DEPLOY_KEY: ${{ secrets.VULTR_DEPLOY_SSH_KEY }}
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo 'Add the VULTR_DEPLOY_SSH_KEY repository secret before deploying.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          install -m 600 infra/deploy/known_hosts ~/.ssh/known_hosts
      - name: Upload and deploy the tested backend
        run: |
          tar -czf "$RUNNER_TEMP/$REVISION.tar.gz" -C openrouter-api app imagine requirements.txt -C .. shared
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$RUNNER_TEMP/$REVISION.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/openrouter-api/incoming/$REVISION.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$REVISION'" < infra/deploy/deploy.sh
      - name: Verify public API
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --connect-timeout 10 --max-time 20 "$API_URL/health" |
            python -c 'import json,os,sys; data=json.load(sys.stdin); assert data["status"] == "ok" and data["revision"] == os.environ["REVISION"], data'
      - name: Remove deployment private key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
